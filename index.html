<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blockchain Application</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header> 
            <h1> Blockchain Application </h1>
            <p>Interact with the blockchain through a simple web interface.</p>
        </header>
        <main>
            <section id="wallet-section">
                <h2>Wallet</h2>
                <button id="connect-wallet"> Connect Wallet </button>
                <p id="wallet-address"> Wallet not connected. </p>
            </section>
            <section id="application-section">
                <h2>Application</h2>
                <!-- Contract-related UI will be added here later -->
                 <p> Smart contract functionality will be available once the contract is integrated. </p>
            </section>
            <section id="status-section">
                <h2>Status</h2>
                <p id="status"> No transaction yet. </p>
            </section>
        </main>
        <footer>
            <p>Blockchain Application</p>
        </footer>
        <script src="frontend.js"></script>
    </body>
</html>
